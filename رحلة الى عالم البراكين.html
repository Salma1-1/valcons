const r=y=>3-.85*y;
[0,1.5*Math.PI].forEach(th=>{for(let j=0;j<4;j++){const y0=j*.8,y1=y0+.8,sp=new T.Shape();sp.moveTo(0,y0);sp.lineTo(r(y0),y0);sp.lineTo(r(y1),y1);sp.lineTo(0,y1);sp.closePath();

const cr=add(new T.TorusGeometry(.3,.07,8,24),LV(1.5),0,3.2,0);cr.rotation.x=Math.PI/2;tag(cr,'crater','الفوهة','فتحة في قمة البركان تخرج منها الغازات والحمم والرماد أثناء الثوران.',[[0,3.2,0],5.5,null,1.1]);
const cd=tag(add(new T.CylinderGeometry(.12,.12,5.9,12),LV(.9),0,.3,0),'conduit','المدخنة الرئيسية','قناة تصعد عبرها الصهارة من الغرفة إلى السطح بدفع الضغط والغازات المذابة فيها. شاهدي الصهارة وهي تصعد.',[[0,.3,0],8,5.5,1.25]);
const ch=tag(add(new T.SphereGeometry(1,24,18),LV(1),0,-3.2,0),'chamber','غرفة الصهارة','خزان ضخم تحت الأرض تتجمع فيه الصهارة الساخنة ويرتفع ضغطها قبل الثوران. أصبحت الأرض شفافة لنرى داخلها.',[[0,-3,0],8,5.5,1.45]);ch.scale.set(1.9,.9,1.5);
[.6,2.0,3.6].forEach(a=>{const g=new T.Group();g.rotation.y=a-Math.PI/2;G.add(g);const f=tag(add(bx(2,.07,.25),LV(1.2),1.7,1.6,0,g),'flows','تدفقات اللابة','لابة تنساب على سفوح البركان وتتجمد ببطء؛ وكلما كانت أسخن وأقل لزوجة انسابت أبعد.',[[0,1.2,0],9,a,1.2]);f.rotation.z=-.7});
const cloud=new T.Group();cloud.position.y=5.2;G.add(cloud);const cb=[];
for(let i=0;i<7;i++){const o=add(new T.SphereGeometry(1,14,10),M(0x4a4642,{transparent:true,opacity:.8}),E(-1.2,1.2),E(-.6,.8),E(-1,1),cloud);o.scale.setScalar(E(.7,1.3));cb.push(o);tag(o,'cloud','السحابة البركانية','رماد وغازات وبخار ماء تندفع إلى الجو وقد تنتشر لمسافات بعيدة وتؤثر في الطيران والمناخ.',[[0,5.2,0],10,null,1.2])}
const cs=stream([0,-2.6,0],[0,3.2,0],50,.22,0xffa030,.05);fire(0,3.3,0,.8,40);smoke(0,3.3,0,1,40);glow.position.set(0,4,2);
an.push((t,dt)=>{const x=sel=='chamber'||sel=='conduit';ug.material.opacity+=((x?.1:.28)-ug.material.opacity)*.1;shell.material.opacity+=((x?.2:1)-shell.material.opacity)*.1;
cs.m.material.size+=((sel=='conduit'?.5:.22)-cs.m.material.size)*.1;ch.scale.set(1.9+.1*Math.sin(t*2),.9+.05*Math.sin(t*2),1.5);cb.forEach((o,i)=>o.position.y+=Math.sin(t+i)*.002)});
home([0,1,0],13,5.5,1.2)}

function bS3(intro){const ground=add(new T.CylinderGeometry(17,17,.4,48),M(0x1d2a1a),0,-.2,0);
for(let i=0;i<50;i++)add(new T.ConeGeometry(.3,1.1,6),M(0x143018),E(-15,15),.5,E(5.8,13)*(R_()<.5?-1:1));
const V=[['shield',-9,[[5.4,0],[3.8,.55],[2.2,1.15],[.8,1.52],[0,1.6]],0x35302d,1.6,'البركان الدرعي','<b>الشكل:</b> واسع ومنبسط بسفوح قليلة الانحدار.<br><b>التكوّن:</b> لابة بازلتية سائلة تنساب بهدوء لمسافات بعيدة وتتراكم طبقة فوق طبقة.<br><b>مثال:</b> ماونا لوا في هاواي.',9],
['strato',0,[[3.8,0],[3,.4],[2,1.1],[1,2.2],[.3,3.2],[0,3.4]],0x5a4a45,3.4,'البركان المركب','<b>الشكل:</b> مخروط عالٍ منحدر الجوانب.<br><b>التكوّن:</b> طبقات متناوبة من لابة لزجة ورماد، وثورانه عنيف تصاحبه سحب رماد.<br><b>مثال:</b> جبل فوجي في اليابان وفيزوف في إيطاليا.',11],
['cinder',7,[[1.8,0],[.35,2.2],[0,1.9]],0x6a2a1a,2.2,'البركان المخروطي','<b>الشكل:</b> مخروط صغير شديد الانحدار.<br><b>التكوّن:</b> تتساقط حول الفوهة قطع صخرية وحمم متناثرة تقذفها الغازات فتتراكم بسرعة.<br><b>مثال:</b> بركان باريكوتين في المكسيك.',7]];
const ev={};V.forEach(([k,x,pts,c,top,t,d,r])=>{const o=add(new T.LatheGeometry(pts.map(p=>new T.Vector2(p[0],p[1])),40),M(c,{side:T.DoubleSide}),x,0,0);
tag(o,k,t,d,[[x,top*.5,0],r,null,1.2]);const cr=add(new T.SphereGeometry(.25,10,8),LV(1.5),x,top,0);cr.scale.y=.4;
let a=[];if(k=='shield'){a=[mk(60,.2,0xff7a20,(i,P,V,L)=>{L[i]=E(1,2.2);P.set([x+E(-.2,.2),top,E(-.2,.2)],i*3);const q=R_()*6.28,v=E(.5,1.4);V.set([Math.cos(q)*v,E(1.5,3),Math.sin(q)*v],i*3)},2.5),
mk(70,.25,0xff4a10,(i,P,V,L)=>{L[i]=3.5;P.set([x,top,0],i*3);const q=R_()*6.28,v=E(.7,1);V.set([Math.cos(q)*v,-.25,Math.sin(q)*v],i*3)})]}
else if(k=='cinder'){a=[mk(90,.18,0xffc040,(i,P,V,L)=>{L[i]=E(1.6,2.2);P.set([x,top,0],i*3);const q=R_()*6.28,v=E(1,3);V.set([Math.cos(q)*v,E(6,9),Math.sin(q)*v],i*3)},10)]}
else{a=[mk(80,1.1,0x7a7066,(i,P,V,L)=>{L[i]=E(4,6);P.set([x+E(-.2,.2),top,E(-.2,.2)],i*3);V.set([E(-.4,.5),E(2,3.2),E(-.4,.4)],i*3)}),fire(x,top,0,1.2,50)]}
a.forEach(p=>p.on=false);ev[k]=a});
an.push(()=>{for(const k in ev)ev[k].forEach(p=>p.on=intro?k=='strato':sel==k)});
if(intro){home([0,2,0],20,.5,1.25)}else{home([-1,1.5,0],24,.2,1.2);card('أنواع البراكين','اضغطي على أي بركان لتقريبه ومشاهدة محاكاة ثورانه المناسبة لنوعه.');scn=[$('#ct').textContent,$('#cd').innerHTML]}
glow.position.set(0,5,4)}

function load(s,b=0,push=true){clear();sec=s;sub=b;t=0;glow.position.set(0,3,0);
if(s==1){B1[b]();scn=I1[b];card(...scn)}else if(s==2)bS2();else bS3(s==0);
if(push&&s>0)hist.push([s,b]);document.body.dataset.sec=s;ui()}
function ui(){document.querySelectorAll('#top .b').forEach(x=>x.classList.toggle('on',x.dataset.s==sec));document.querySelectorAll('#chips .b').forEach((x,i)=>x.classList.toggle('on',i==sub));$('#pz').textContent=paused?'▶ تشغيل':'⏸ إيقاف'}
I1.forEach((x,i)=>{const b=document.createElement('button');b.className='b';b.textContent=x[0];b.onclick=()=>load(1,i);$('#chips').appendChild(b)});
document.querySelectorAll('#top .b').forEach(b=>b.onclick=()=>load(+b.dataset.s,0));
$('#go').onclick=()=>load(1,0);$('#pz').onclick=()=>{paused=!paused;ui()};$('#rep').onclick=()=>load(sec,sub,false);
function desel(){sel=null;card(...scn);view(...hm)}
$('#back').onclick=()=>{if(sel)return desel();if(hist.length>1){hist.pop();const h=hist[hist.length-1];load(h[0],h[1],false)}else{hist=[];load(0,0,false)}};
function pick(k){if(sec==0)return;const r=reg[k];sel=k;card(r.t,r.d);if(r.v)view(...r.v)}
const ray=new T.Raycaster(),mv=new T.Vector2();
function click(e){const b=cv.getBoundingClientRect();mv.set((e.clientX-b.left)/b.width*2-1,-((e.clientY-b.top)/b.height)*2+1);ray.setFromCamera(mv,C);
const h=ray.intersectObjects(G.children,true).find(x=>x.object.userData.k);if(h)pick(h.object.userData.k);else if(sel)desel()}
const pts=new Map();let moved=0,d0=1;const pd=()=>{const a=[...pts.values()];return a.length<2?1:Math.hypot(a[0][0]-a[1][0],a[0][1]-a[1][1])||1};
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);pts.set(e.pointerId,[e.clientX,e.clientY]);if(pts.size==1)moved=0;d0=pd()});
cv.addEventListener('pointermove',e=>{const p=pts.get(e.pointerId);if(!p)return;moved+=Math.abs(e.clientX-p[0])+Math.abs(e.clientY-p[1]);
if(pts.size==1){go.th-=(e.clientX-p[0])*.008;go.ph=cl(go.ph-(e.clientY-p[1])*.006,.15,1.6)}pts.set(e.pointerId,[e.clientX,e.clientY]);if(pts.size==2){const d=pd();go.r=cl(go.r*d0/d,3,40);d0=d}});
cv.addEventListener('pointerup',e=>{const was=pts.size;pts.delete(e.pointerId);if(moved<8&&was==1)click(e)});
cv.addEventListener('pointercancel',e=>pts.delete(e.pointerId));
cv.addEventListener('wheel',e=>{go.r=cl(go.r*(1+e.deltaY*.001),3,40)},{passive:true});
function resize(){R.setSize(innerWidth,innerHeight,false);C.aspect=innerWidth/innerHeight;C.fov=C.aspect<1?72:50;C.updateProjectionMatrix()}
addEventListener('resize',resize);resize();
let last=performance.now();
function loop(n){requestAnimationFrame(loop);let dt=Math.min(.05,(n-last)/1000);last=n;if(paused)dt=0;t+=dt;
if(sec==0)go.th+=dt*.12;an.forEach(f=>f(t,dt));ps.forEach(p=>p.tick(dt));
for(const k in reg)reg[k].m.forEach(o=>{const e=o.userData.e;if(!e||sec==1&&sub==5&&k=='cn')return;const s=k==sel;o.material.emissive.setHex(s?0xff9a30:e[0]);o.material.emissiveIntensity=s?.5+.4*Math.sin(n*.006):e[1]});
glow.intensity=2+Math.sin(n*.02)*.5+Math.sin(n*.047)*.4;
const k=.06;cam.th+=(go.th-cam.th)*k;cam.ph+=(go.ph-cam.ph)*k;cam.r+=(go.r-cam.r)*k;cam.t.lerp(go.t,k);
C.position.set(cam.t.x+cam.r*Math.sin(cam.ph)*Math.sin(cam.th),cam.t.y+cam.r*Math.cos(cam.ph),cam.t.z+cam.r*Math.sin(cam.ph)*Math.cos(cam.th));C.lookAt(cam.t);R.render(S,C)}
load(0,0,false);requestAnimationFrame(loop);
